name: Build and Deploy

on:
  push:
    branches:
    - main

jobs:
  build-and-deploy:
    runs-on: docker

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        server_url: https://forgejo.home.potato

    - name: Login to registry
      run: make login
      env:
        REGISTRY_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

    - name: Build and push
      run: make push

    - name: Trigger host deploy
      run: |
        curl -fsS -k -X POST https://deploy.home.potato/hooks/deploy-macchina-gialla \
          -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}"
